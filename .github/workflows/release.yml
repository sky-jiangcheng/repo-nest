name: Build and Release (Wails)

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'trae/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - target: darwin-amd64
            runner: macos-latest
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Generate app icons from SVG
        shell: bash
        run: |
          if [ -f "build/icon.svg" ]; then
            # Initialize a temp package.json in root so npm install works
            if [ ! -f "package.json" ]; then
              node -e "require('fs').writeFileSync('package.json', JSON.stringify({name:'reponest-build',version:'0.0.0',private:true},null,2))"
            fi
            npm install --no-save sharp 2>&1 || true
            if node scripts/generate-icons.mjs 2>&1; then
              echo "Icons generated successfully"
              ls -la build/icons/ || true
              ls -la build/appicon.png || true
            else
              echo "Icon generation failed, continuing without custom icons"
            fi
          fi

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Build Wails app
        shell: bash
        run: |
          # Generate macOS .icns from PNG icons before build
          if [ "${{ runner.os }}" = "macOS" ] && [ -d "build/icons" ]; then
            mkdir -p build/icons/icon.iconset
            cp build/icons/icon-512.png build/icons/icon.iconset/icon_512x512.png
            cp build/icons/icon-256.png build/icons/icon.iconset/icon_256x256.png
            cp build/icons/icon-128.png build/icons/icon.iconset/icon_128x128.png
            cp build/icons/icon-64.png build/icons/icon.iconset/icon_32x32@2x.png
            cp build/icons/icon-32.png build/icons/icon.iconset/icon_32x32.png
            cp build/icons/icon-16.png build/icons/icon.iconset/icon_16x16.png
            iconutil -c icns build/icons/icon.iconset -o build/icons/icon.icns
            rm -rf build/icons/icon.iconset
            echo "Generated icon.icns"
          fi

          # Read version from wails.json (SSOT) and inject into Go binary via ldflags.
          # scripts/bump-version.sh keeps wails.json, package.json, docs in sync; this
          # step guarantees the binary itself reports the same version at runtime.
          APP_VERSION=$(grep -oE '"productVersion"[[:space:]]*:[[:space:]]*"[^"]+"' wails.json | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          echo "Building version: $APP_VERSION"
          LDFLAGS="-X repo-nest/internal/version.Version=$APP_VERSION"

          export PATH=$PATH:$(go env GOPATH)/bin
          if [ "${{ runner.os }}" = "Linux" ]; then
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
            wails build -platform ${{ matrix.goos }}/${{ matrix.goarch }} -clean -tags webkit2_41 -ldflags "$LDFLAGS"
          elif [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            GOOS=darwin GOARCH=amd64 go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
            cp $(go env GOPATH)/bin/darwin_amd64/wails $(go env GOPATH)/bin/wails-amd64
            arch -x86_64 $(go env GOPATH)/bin/wails-amd64 build -platform ${{ matrix.goos }}/${{ matrix.goarch }} -clean -ldflags "$LDFLAGS"
          else
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
            wails build -platform ${{ matrix.goos }}/${{ matrix.goarch }} -clean -ldflags "$LDFLAGS"
          fi

      # reponest-mcp is the AI execution interface (MCP stdio server) and ships as
      # its own release asset so `claude mcp add reponest -- ...` works without
      # building from source. Pure Go / zero CGO, so the matrix target builds
      # natively. Version is injected from wails.json (SSOT), same as the app.
      - name: Build MCP server
        shell: bash
        run: |
          set -e
          APP_VERSION=$(grep -oE '"productVersion"[[:space:]]*:[[:space:]]*"[^"]+"' wails.json | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          echo "Building reponest-mcp version: $APP_VERSION"
          LDFLAGS="-X reponest/internal/version.Version=$APP_VERSION"
          mkdir -p build/mcp
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "$LDFLAGS" -o build/mcp/reponest-mcp ./cmd/mcp/
          # `go build -o name` uses the name verbatim, so add the Windows suffix
          # ourselves — release assets / manifests / scoop all expect reponest-mcp.exe.
          if [ "${{ runner.os }}" = "Windows" ] && [ -f build/mcp/reponest-mcp ]; then
            mv build/mcp/reponest-mcp build/mcp/reponest-mcp.exe
          fi
          ls -lh build/mcp/

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          set -e
          mkdir -p build/bin/release
          tar -czf "build/bin/release/reponest-linux-amd64.tar.gz" -C build/bin reponest
          tar -czf "build/bin/release/reponest-mcp-linux-amd64.tar.gz" -C build/mcp reponest-mcp
          echo "RELEASE_DIR=build/bin/release" >> $GITHUB_ENV

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p release

          # Wails produces .app bundle in build/bin/
          APP=$(ls -d build/bin/*.app 2>/dev/null | head -1)
          APP_NAME=$(basename "$APP" .app)

          if [ -n "$APP" ]; then
            APP_NAME=$(basename "$APP")
            APP_PATH="$APP"

            if [ -n "$APPLE_CERTIFICATE" ]; then
              echo "Signing $APP_NAME..."
              echo "$APPLE_CERTIFICATE" | base64 -d -o /tmp/cert.p12
              security create-keychain -p "github-actions" /tmp/signing.keychain
              security import /tmp/cert.p12 -k /tmp/signing.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
              security list-keychains -s /tmp/signing.keychain
              security default-keychain -s /tmp/signing.keychain
              security unlock-keychain -p "github-actions" /tmp/signing.keychain
              codesign --deep --force --sign "$APPLE_TEAM_ID" --options runtime "$APP_PATH"
              echo "Signed successfully"
            fi

            STAGING=$(mktemp -d)
            cp -R "$APP" "$STAGING/"
            ln -s /Applications "$STAGING/Applications"
            mkdir -p "$STAGING/.background"
            sips -s format png "build/dmg-background.svg" --out "$STAGING/.background/background.png"
            pip install create-dmg 2>/dev/null || brew install create-dmg 2>/dev/null || curl -sL https://github.com/create-dmg/create-dmg/archive/refs/tags/v1.0.0.tar.gz | tar -xz && cd create-dmg-1.0.0 && sudo make install && cd ..
            create-dmg \
              --volname "$APP_NAME" \
              --window-size 600 400 \
              --icon-size 80 \
              --icon "$APP_NAME" 100 280 \
              --hide-extension "$APP_NAME" \
              --app-drop-link 400 280 \
              --background "$STAGING/.background/background.png" \
              --format UDZO \
              "release/reponest-${{ matrix.target }}.dmg" \
              "$STAGING/"
            rm -rf "$STAGING"

            if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
              echo "Notarizing DMG..."
              xcrun notarytool submit "release/reponest-${{ matrix.target }}.dmg" --keychain-profile "github-actions" --wait 2>&1 || true
              xcrun stapler staple "release/reponest-${{ matrix.target }}.dmg" 2>&1 || true
            fi
          fi

          # MCP server: separate archive, same release, no codesign/notary impact
          # on the .dmg above.
          tar -czf "release/reponest-mcp-${{ matrix.target }}.tar.gz" -C build/mcp reponest-mcp

          echo "RELEASE_DIR=release" >> $GITHUB_ENV

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release
          if [ -f "build/bin/reponest.exe" ]; then
            powershell Compress-Archive -Path "build/bin/reponest.exe" -DestinationPath "release/reponest-windows-amd64.zip"
          fi
          if [ -f "build/mcp/reponest-mcp.exe" ]; then
            powershell Compress-Archive -Path "build/mcp/reponest-mcp.exe" -DestinationPath "release/reponest-mcp-windows-amd64.zip"
          fi
          echo "RELEASE_DIR=release" >> "$GITHUB_ENV"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ env.RELEASE_DIR }}/
          if-no-files-found: error

  vscode-extension:
    name: Package VS Code extension
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json

      - name: Package VSIX
        run: |
          set -euo pipefail
          VER="${GITHUB_REF#refs/tags/v}"
          cd ide/vscode
          npm ci
          npm run compile
          npx @vscode/vsce package --no-dependencies -o "../../reponest-vscode-${VER}.vsix"

      - name: Upload vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix-extension
          path: reponest-vscode-*.vsix
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build, vscode-extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: '{bundle-*,vsix-extension}'
          merge-multiple: true

      - name: List release files
        run: ls -lhR

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          # This job has no checkout step, so everything at the workspace root
          # is a downloaded release artifact. Exclude SHA256SUMS itself from
          # its own list. scripts/install.sh and install.ps1 verify every
          # download against this file (and skip gracefully when it is
          # absent, so pre-checksum releases keep installing).
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            *.dmg
            *.AppImage
            *.deb
            *.msi
            *.vsix
            *.zip
            *.tar.gz
            SHA256SUMS
          generate_release_notes: true

  # Publish the extension to the VS Code Marketplace with the same version
  # number as the product release. Requires the VSCE_PAT secret (a Personal
  # Access Token with Marketplace > Manage scope from the sky-jiangcheng
  # publisher's Azure DevOps account). Without the secret this job skips
  # with a warning and the release still ships — the vsix is on the release
  # either way, so users can install manually.
  publish-marketplace:
    name: Publish to VS Code Marketplace
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json

      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret is not set — skipping Marketplace publish. The vsix is still attached to this release for manual install."
            exit 0
          fi
          cd ide/vscode
          npm ci
          npm run compile
          npx @vscode/vsce publish "$VER" --no-dependencies
          echo "Published reponest-vscode@$VER to the VS Code Marketplace."

  # After the release is published, the sha256 of every shipped asset is a
  # known fact. Homebrew and Scoop hard-fail on a missing/wrong digest, so the
  # manifests ship with `__FILL_SHA256_*__` placeholders (or a stale digest from
  # the previous release) and get stamped here. This job reads the per-asset
  # digest the GitHub Release API reports for the tag (one call replaces
  # downloading every asset just to hash it locally), writes
  # assets/releases/v<ver>/SHA256SUMS, runs scripts/update-manifests.sh
  # --fill-sha256, verifies no placeholder survived, and commits the packaging/
  # changes back to master so the downstream tap/bucket can pick them up.
  fill-sha256:
    name: Fill manifest sha256
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Check out the default branch, not the tag, so the manifest commit
          # can be pushed back. REPO_PUSH_TOKEN (PAT) lets the push itself
          # trigger downstream workflows; GITHUB_TOKEN is the fallback.
          token: ${{ secrets.REPO_PUSH_TOKEN || github.token }}
          ref: master

      - name: Compute version from tag
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Read published digests from the Release API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          DIR="assets/releases/v$VER"
          mkdir -p "$DIR"
          # The Release API reports a sha256 digest per uploaded asset; one call
          # replaces downloading every asset just to hash it locally. Assets
          # without a digest are simply absent from SHA256SUMS, which makes
          # --fill-sha256 skip the manifests that reference them - a partial
          # release leaves placeholders instead of writing wrong hashes. The
          # repo slug is the canonical one (no redirect dependence).
          python3 - "$VER" "$DIR/SHA256SUMS" <<'PY'
          import json, os, sys, urllib.request
          ver, out = sys.argv[1], sys.argv[2]
          url = f"https://api.github.com/repos/sky-jiangcheng/repo-nest/releases/tags/v{ver}"
          headers = {"Accept": "application/vnd.github+json"}
          # Authenticate when a token is available: shared runner IPs exhaust
          # the anonymous 60 req/hour limit and make this step flaky.
          token = os.environ.get("GITHUB_TOKEN", "")
          if token:
              headers["Authorization"] = f"Bearer {token}"
          rel = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=headers)))
          with open(out, "w") as fh:
              for asset in rel.get("assets", []):
                  name = asset.get("name", "")
                  digest = asset.get("digest", "")
                  if name == "SHA256SUMS" or not digest.startswith("sha256:"):
                      continue
                  fh.write(f"{digest[7:]}  assets/releases/v{ver}/{name}\n")
          PY
          cat "$DIR/SHA256SUMS"

      - name: Fill sha256 in packaging manifests
        run: ./scripts/update-manifests.sh --fill-sha256

      - name: Verify every manifest digest belongs to this release
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          SUMS="assets/releases/v$VER/SHA256SUMS"
          # Gate 1: no placeholder may survive in the MANIFESTS. brew/scoop
          # hard-fail on them. The grep is scoped to the manifest trees only:
          # an unscoped grep over packaging/ also matched the README, which
          # documents the placeholder format verbatim, so this gate failed on
          # its own docs and blocked every release fill since it was added
          # (v1.13.0, v1.14.0, v1.14.1).
          if grep -rn "__FILL_SHA256_" packaging/homebrew packaging/scoop; then
            echo "ERROR: at least one asset this release should ship is missing" >&2
            echo "       (its manifest kept the placeholder). Check the release page." >&2
            exit 1
          fi
          # Gate 2: freshness. A normal bump leaves the PREVIOUS release's
          # digests in place; if --fill-sha256 skipped an asset that exists in
          # no manifest line it touched, a stale digest would silently ship
          # and break every install. Every 64-hex digest in packaging/ must
          # appear in THIS release's SHA256SUMS.
          bad=0
          for d in $(grep -rhoE '[a-f0-9]{64}' packaging/homebrew packaging/scoop | sort -u); do
            if ! grep -q "$d" "$SUMS"; then
              echo "STALE digest in packaging/: $d"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "ERROR: packaging/ carries digests that do not match release v$VER." >&2
            exit 1
          fi
          echo "all packaging/ digests match release v$VER"

      - name: Commit and push manifests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/
          if git diff --cached --quiet; then
            echo "no manifest changes (all digests current)"
            exit 0
          fi
          git commit -m "chore(packaging): fill sha256 for v${{ steps.ver.outputs.version }}" \
                     -m "Automated by release.yml fill-sha256 job."
          git push origin HEAD:master
          echo "pushed packaging/ manifest updates to master"